<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Carrito de la compra</title>
</head>
<body>
  <h1>Carrito de la compra</h1>

  <form onsubmit="return false;">
    <label for="cantidad">Cantidad:</label>
    <input type="text" id="cantidad" name="cantidad">
    <br><br>

    <label for="descripcion">Descripción:</label>
    <input type="text" id="descripcion" name="descripcion">
    <br><br>

    <button type="button" onclick="comprarProducto()">Comprar producto</button>
    <button type="button" onclick="verCarrito()">Ver carrito</button>
  </form>

  <p>Abre la consola del navegador (F12) para ver el carrito.</p>
  <p><a href="otra.html">Ir a otra página</a></p>

  <script src="carrito.js"></script>
</body>
</html>
